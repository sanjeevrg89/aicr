# ============================================================================
# WORKLOAD GATING
# ============================================================================
# node-validate labels each GPU node with:
#   aicr.nvidia.com/recipe-compliant: "true" | "false"
#   aicr.nvidia.com/last-validated: <RFC3339 timestamp>
#
# To gate GPU workloads on compliant nodes, add a nodeSelector to your
# training/inference pods:
#
#   spec:
#     nodeSelector:
#       aicr.nvidia.com/recipe-compliant: "true"
#
# Or configure KAI Scheduler / Kueue ResourceFlavors to target only
# compliant nodes:
#
#   apiVersion: kueue.x-k8s.io/v1beta1
#   kind: ResourceFlavor
#   metadata:
#     name: compliant-h100
#   spec:
#     nodeLabels:
#       nvidia.com/gpu.present: "true"
#       aicr.nvidia.com/recipe-compliant: "true"
#
# ============================================================================
#
# DaemonSet for continuous per-node recipe compliance validation.
# Runs aicr node-validate on every GPU node in a loop, labels nodes
# with compliance status, and integrates with Skyhook's workload gate.
#
# Autoscaler integration flow:
#   Autoscaler adds node → GPU Operator installs drivers →
#   Skyhook applies gate taint → node-validate DaemonSet pod starts →
#   evaluates recipe constraints → labels node with compliance status →
#   if compliant: external automation or Skyhook removes gate taint
#   if non-compliant: taint remains → no GPU workloads scheduled
#
# Prerequisites:
#   - AICR CLI image (ghcr.io/nvidia/aicr)
#   - Recipe stored as ConfigMap: kubectl create configmap aicr-recipe \
#       --from-file=recipe.yaml -n aicr-validation
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aicr-node-validate
  namespace: aicr-validation
  labels:
    app.kubernetes.io/name: aicr
    app.kubernetes.io/component: node-validate
    app.kubernetes.io/managed-by: aicr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aicr
      app.kubernetes.io/component: node-validate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aicr
        app.kubernetes.io/component: node-validate
    spec:
      serviceAccountName: aicr-node-validate
      # Run on GPU nodes only
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Tolerate all taints including Skyhook's workload gate
      # so validation runs before the gate is removed
      tolerations:
        - operator: Exists
      containers:
        - name: node-validate
          image: ghcr.io/nvidia/aicr:latest
          command:
            - aicr
            - node-validate
            - --recipe
            - /etc/aicr/recipe.yaml
            - --label-node
            - --interval
            - "5m"
            - --format
            - json
          env:
            # Node name via Downward API (required by collectors)
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: recipe
              mountPath: /etc/aicr
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: recipe
          configMap:
            name: aicr-recipe
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aicr-node-validate
  namespace: aicr-validation
  labels:
    app.kubernetes.io/name: aicr
    app.kubernetes.io/component: node-validate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aicr-node-validate
  labels:
    app.kubernetes.io/name: aicr
    app.kubernetes.io/component: node-validate
rules:
  # Node labeling (--label-node)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  # Snapshot collection (K8s collector needs pod/namespace listing)
  - apiGroups: [""]
    resources: ["pods", "namespaces", "configmaps"]
    verbs: ["get", "list"]
  # ClusterPolicy collection (GPU Operator policy)
  - apiGroups: ["*"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aicr-node-validate
  labels:
    app.kubernetes.io/name: aicr
    app.kubernetes.io/component: node-validate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aicr-node-validate
subjects:
  - kind: ServiceAccount
    name: aicr-node-validate
    namespace: aicr-validation
